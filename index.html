<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toriv's Spots Project</title>
    <meta name="description" content="This Is Toriv's Project. It is called Spots">
    <meta name="author" content="Victor Juarez">
    <meta name="keywords" content="project, spots, TripleTen">
    <link rel="stylesheet" href="./pages/index.css">
    <link rel="icon" href="favicon.ico">
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header">
        <img src="./images/spots_logo.svg" class="header__logo" alt="Spots logo">
      </header>
      <main class="content">
        <section class="profile">
          <img src="./images/avatar.jpg" class="profile__picture" alt="Picture of Bessie Coleman">
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__title">Civil Aviator</p>
            <button type="button" class="profile__edit-button">
                <img src="./images/edit_icon.svg" alt="Edit Icon">
                Edit Profile
            </button>
          </div>
          <button class="new-post-btn" type="button">
            <img src="./images/Plus_icon.png" alt="Plus Icon" class="new-post-btn__plus">
            New Post
          </button>
        </section>
        <section class="cards">
          <ul class="cards-list">
            <!---  Reminder! This is where the Posts Go  -->
          </ul>
        </section>
        <div class="modal" id="edit-profile-modal">
          <div class="modal__container">
            <div class="modal__header">
              <button type="button" class="modal__close-btn"><img src="./images/close_btn.svg" class="modal__close-btn-img" alt="Close Button"></button>
              <h2 class="modal__header-title">Edit profile</h2>
            </div>
            <form class="modal__form" name="editProfileForm">
              <label for="edit-name" class="modal__label">
                Name
                <input id="edit-name" class="modal__input" type="text" placeholder="Type your name" required>
              </label>
              <label for="edit-description" class="modal__label">
              Description
              <input id="edit-description" class="modal__input" type="text" placeholder="Describe yourself" required>
              </label>
              <button type="submit" class="modal__submit-btn">Save</button>
            </form>
          </div>
        </div>
        <div class="modal" id="new-post-modal">
          <div class="modal__container">
            <div class="modal__header">
              <button type="button" class="modal__close-btn"><img src="./images/close_btn.svg" class="modal__close-btn-img" alt="Close Button"></button>
              <h2 class="modal__header-title">New Post</h2>
            </div>
            <form class="modal__form" name="postImageForm">
              <label for="post-img-link" class="modal__label">
                Image Link
                <input id="post-img-link" class="modal__input" type="url" placeholder="Paste a link to the picture" required>
              </label>
              <label for="post-caption" class="modal__label">
                Caption
                <input id="post-caption" class="modal__input" type="text" placeholder="Type your caption" required>
              </label>
              <button type="submit" class="modal__submit-btn">Save</button>
            </form>
          </div>
        </div>
        <div class="modal" id="open-image-modal">
          <div class="modal__container-images">
            <button type="button" class="modal__close-btn modal__close-btn_type_preview"><img src="./images/close_btn--white.svg" class="modal__close-btn-img" alt="Close Button"></button>
            <img src="#" alt="#" class="modal__picture">
            <h2 class="modal__title"></h2>
          </div>
        </div>
        <template id="card-template">
          <li class="card">
            <button type="button" class="card__button-picture"><img src="" alt="" class="card__picture"></button>
            <div class="card__content">
              <h2 class="card__name"></h2>
              <button class="card__like" type="button"></button>
            </div>
            <button class="card__delete" type="button"><img class="card__delete-icon" src="./images/delete_icon.svg" alt="delete"></button>
          </li>
        </template>
      </main>
      <footer class="footer">
        <p>2025 © Spots</p>
      </footer>
    </div>
    <script src="./scripts/index.js"></script>
  </body>
</html>
